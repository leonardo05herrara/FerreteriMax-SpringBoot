<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} + ' - Ferreteria MAX'">Usuario</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-tools"></i> Ferreteria MAX
        </a>
    </div>
</nav>

<div class="container mt-4" style="max-width:600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white fw-bold">
            <i class="bi bi-person-fill me-2"></i>
            <span th:text="${titulo}">Usuario</span>
        </div>
        <div class="card-body">

            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Nombre *</label>
                    <input type="text" class="form-control" th:field="*{nombre}"
                           placeholder="Nombre completo"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}"
                         th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electronico *</label>
                    <input type="email" class="form-control" th:field="*{correo}"
                           placeholder="correo@ejemplo.com"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('correo')}"
                         th:errors="*{correo}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefono</label>
                    <input type="text" class="form-control" th:field="*{telefono}"
                           placeholder="300 123 4567"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Direccion</label>
                    <input type="text" class="form-control" th:field="*{direccion}"
                           placeholder="Calle 123 # 45-67"/>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                    <a th:href="@{/usuarios}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
