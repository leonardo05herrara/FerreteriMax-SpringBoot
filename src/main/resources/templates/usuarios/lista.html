<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Usuarios - Ferreteria MAX</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-tools"></i> Ferreteria MAX
        </a>
        <div>
            <a th:href="@{/productos}" class="btn btn-sm btn-outline-light me-2">Productos</a>
            <a th:href="@{/usuarios}" class="btn btn-sm btn-light">Usuarios</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2><i class="bi bi-people"></i> Gestion de Usuarios</h2>

    <!-- Mensaje flash -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Boton nuevo -->
    <div class="mb-3">
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Nuevo Usuario
        </a>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Telefono</th>
                        <th>Direccion</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Iteracion Thymeleaf sobre la lista de usuarios -->
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.correo}"></td>
                        <td th:text="${u.telefono}"></td>
                        <td th:text="${u.direccion}"></td>
                        <td class="text-center">
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Eliminar este usuario?')">
                                <i class="bi bi-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No hay usuarios registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted small mt-2">
        Total: <span th:text="${#lists.size(usuarios)}"></span> usuario(s)
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
