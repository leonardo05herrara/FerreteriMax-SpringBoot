<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Productos - Ferreteria MAX</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-warning">
    <div class="container">
        <a class="navbar-brand fw-bold text-dark" th:href="@{/}">
            <i class="bi bi-tools"></i> Ferreteria MAX
        </a>
        <div>
            <a th:href="@{/productos}" class="btn btn-sm btn-dark me-2">Productos</a>
            <a th:href="@{/usuarios}" class="btn btn-sm btn-outline-dark">Usuarios</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2><i class="bi bi-box-seam"></i> Gestion de Productos</h2>

    <!-- Mensaje flash -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Boton nuevo -->
    <div class="mb-3">
        <a th:href="@{/productos/nuevo}" class="btn btn-warning">
            <i class="bi bi-plus-circle"></i> Nuevo Producto
        </a>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoria</th>
                        <th class="text-end">Precio ($)</th>
                        <th>Icono</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Iteracion Thymeleaf sobre la lista de productos -->
                    <tr th:each="p : ${productos}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td><span class="badge bg-secondary" th:text="${p.categoria}"></span></td>
                        <td class="text-end" th:text="${#numbers.formatInteger(p.precio,1,'COMMA')}"></td>
                        <td th:text="${p.icono}"></td>
                        <td class="text-center">
                            <a th:href="@{/productos/editar/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:href="@{/productos/eliminar/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Eliminar este producto?')">
                                <i class="bi bi-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    <!-- Mensaje cuando no hay registros -->
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No hay productos registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted small mt-2">
        Total: <span th:text="${#lists.size(productos)}"></span> producto(s)
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
